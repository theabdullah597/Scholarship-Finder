apiVersion: v1
kind: Namespace
metadata:
  name: opportunityabroad
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: opportunityabroad
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: opportunityabroad-config, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: opportunityabroad-config, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: opportunityabroad-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: opportunityabroad
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: opportunityabroad
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: opportunityabroad
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: v1
kind: Secret
metadata:
  name: opportunityabroad-secrets
  namespace: opportunityabroad
type: Opaque
stringData:
  SECRET_KEY: replace-with-a-random-32-character-secret
  POSTGRES_PASSWORD: replace-with-a-database-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opportunityabroad-config
  namespace: opportunityabroad
data:
  ENVIRONMENT: production
  POSTGRES_USER: postgres
  POSTGRES_DB: opportunityabroad
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  ALLOWED_ORIGINS: https://opportunityabroad.example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: opportunityabroad
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: opportunityabroad/api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: opportunityabroad-config }
            - secretRef: { name: opportunityabroad-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: opportunityabroad
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: opportunityabroad/api:latest
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: opportunityabroad-config }
            - secretRef: { name: opportunityabroad-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: opportunityabroad
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: opportunityabroad
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: opportunityabroad/web:latest
          ports: [{ containerPort: 5173 }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: opportunityabroad
spec:
  type: LoadBalancer
  selector: { app: web }
  ports: [{ port: 80, targetPort: 5173 }]
